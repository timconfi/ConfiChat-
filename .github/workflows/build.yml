name: Build Confichat APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for Icon Processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Android Project & Process User Icon
        run: |
          rm -rf android-project
          mkdir -p android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/java/com/confichat/app
          mkdir -p android-project/app/src/main/res/layout
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi

          # Копируем веб-файл
          if [ -f "index.html" ]; then
            cp index.html android-project/app/src/main/assets/index.html
          fi

          # Автоматический поиск любого фото пользователя в репозитории или генерация иконки конфетти
          python3 - << 'EOF'
          import os, glob, math
          from PIL import Image, ImageDraw

          found_img = None
          for pattern in ["*.png", "*.jpg", "*.jpeg", "*.webp", "*.PNG", "*.JPG", "*.JPEG"]:
              for file in glob.glob(pattern):
                  if "launcher" not in file:
                      found_img = file
                      break
              if found_img:
                  break

          if found_img:
              print(f"Found user icon: {found_img}")
              base_img = Image.open(found_img).convert("RGBA")
          else:
              print("Generating Confichat Lollipop & Confetti 3D icon...")
              base_img = Image.new("RGBA", (512, 512), color=(142, 68, 173, 255))
              draw = ImageDraw.Draw(base_img)
              # Фирменный фиолетовый фон
              draw.rounded_rectangle([(16, 16), (496, 496)], radius=110, fill=(155, 89, 182, 255))
              # Розовый леденец диалога
              draw.ellipse([(90, 80), (420, 390)], fill=(255, 118, 117, 255))
              draw.ellipse([(140, 130), (370, 340)], fill=(255, 234, 167, 255))
              # Хлопушка с конфетти
              draw.polygon([(340, 320), (430, 430), (380, 460), (310, 350)], fill=(232, 67, 147, 255))
              draw.ellipse([(410, 170), (430, 190)], fill=(253, 203, 110, 255))
              draw.ellipse([(110, 310), (130, 330)], fill=(116, 185, 255, 255))

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              resized = base_img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(f"android-project/app/src/main/res/{folder}/ic_launcher.png")
              resized.save(f"android-project/app/src/main/res/{folder}/ic_launcher_round.png")
          EOF

          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Confichat"
          include ':app'
          EOF

          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # Сборка с официальной версией v1.0.2
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.confichat.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.confichat.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.0.2"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Confichat"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Confichat"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Confichat" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:statusBarColor">#d63031</item>
                  <item name="android:navigationBarColor">#ffffff</item>
                  <item name="android:windowBackground">#fff2f2</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Confichat</string>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#fff2f2">

              <WebView
                  android:id="@+id/confichatWebView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#fff2f2" />
          </FrameLayout>
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/confichat/app/MainActivity.kt
          package com.confichat.app

          import android.Manifest
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.webkit.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private val PERMISSION_REQ_CODE = 200

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.confichatWebView)
                  webView.setBackgroundColor(Color.parseColor("#fff2f2"))

                  requestPermissions()
                  setupWebView()
              }

              private fun requestPermissions() {
                  val list = mutableListOf(
                      Manifest.permission.CAMERA,
                      Manifest.permission.RECORD_AUDIO
                  )
                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.S_V2) {
                      list.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  val needed = list.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (needed.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toTypedArray(), PERMISSION_REQ_CODE)
                  }
              }

              private fun setupWebView() {
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      allowFileAccessFromFileURLs = true
                      allowUniversalAccessFromFileURLs = true
                      mediaPlaybackRequiresUserGesture = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          return false
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          request?.grant(request.resources)
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd android-project
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Confichat-v1.0.2-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
